<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blitzedo — Texture demo</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Blitzedo is a small game studio building worlds worth getting lost in.">
  <meta name="theme-color" content="#090A08">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px var(--gutter, 40px) 0; }
    .demo-bar__label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-right: 6px; }
    .demo-bar button { font: inherit; font-size: 14px; color: var(--ivory); background: transparent; border: 1px solid rgba(251, 245, 235, 0.25);
      border-radius: 4px; padding: 7px 12px; cursor: pointer; }
    @media (max-width: 900px) {
      .demo-bar { flex-wrap: nowrap; gap: 6px; padding-top: 10px; }
      .demo-bar__label { display: none; }
      .demo-bar button { flex: 1; font-size: 12px; padding: 6px 4px; white-space: nowrap; }
      .hero { min-height: calc(100svh - var(--header-h) - 44px); }
      .hero__sculpture { height: max(260px, calc(100svh - var(--header-h) - 2 * 0.82 * 24vw - 166px)); }
    }
    .demo-bar button[aria-checked="true"] { background: var(--red); border-color: var(--red); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="./" aria-label="blitzedo, home">blitzedo</a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="menu-toggle__label">Menu</span>
      <span class="menu-toggle__bars" aria-hidden="true"><i></i><i></i></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <a href="games.html">Games</a>
      <a href="studio.html">Studio</a>
      <a href="contact.html" class="site-nav__contact">
        Contact
        <svg class="icon icon--up-right" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M3.5 12.5 12 4M5.2 3.8h7v7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </a>
    </nav>
  </header>

  <main id="main">
    <div class="demo-bar" role="radiogroup" aria-label="Texture">
      <span class="demo-bar__label">Texture demo</span>
      <button type="button" role="radio" aria-checked="false" data-src="assets/sculpture.webp">Current</button>
      <button type="button" role="radio" aria-checked="false" data-src="assets/demo-redtex.webp">Pixel red</button>
      <button type="button" role="radio" aria-checked="true" data-src="assets/demo-pixeltex.webp">Pixel red + stone</button>
    </div>
    <section class="hero">
      <div class="hero__copy">
        <h1 class="hero__title">Play<br>beyond</h1>
        <a class="btn" href="games.html">
          <span>Explore games</span>
          <svg class="icon icon--arrow" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true" focusable="false">
            <path d="M1 10h24M17 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </a>
      </div>

      <figure class="hero__art">
        <div class="hero__stage" data-explorer="0.28578 0.13667 0.14725 0.16426 14">
          <img class="hero__sculpture"
            src="assets/demo-pixeltex.webp"
            width="2180" height="2356"
            alt="A lowercase b built from small charcoal blocks, floating on a rocky island. A stairway climbs from a red-lit doorway in the bowl to a tiny ivory explorer in a red scarf."
            fetchpriority="high" decoding="async">
        </div>
      </figure>
    </section>
  </main>

  <script src="js/menu.js" defer></script>
  <script src="js/explorer.js" defer></script>
  <script>
    document.querySelectorAll('.demo-bar button').forEach(function (b, _, all) {
      b.addEventListener('click', function () {
        all.forEach(function (o) { o.setAttribute('aria-checked', String(o === b)); });
        document.querySelector('.hero__sculpture').src = b.getAttribute('data-src');
      });
    });
  </script>
</body>
</html>
