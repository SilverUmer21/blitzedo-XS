<script type="module">
import {createFilm, T} from './film.js';
import {createOverlay} from './overlay.js';
const q = new URLSearchParams(location.search);
const stage = document.querySelector('#stage');
const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = q.has('render') ? 'none' : `scale(${s})`; };

const film = await createFilm({canvas: gl, scale: +(q.get('scale') || 1)});
const flat = film.flatRect();
const overlay = await createOverlay(document.querySelector('#type'), T, flat);
const endbgFx = document.querySelector('#endbg');
window.film = film; window.T = T; window.DURATION = Math.ceil(overlay.duration * 30) / 30;
window.seek = t => {
  const handed = t >= T.hand;
  if (!handed) { const r = film.seek(t); flash.style.opacity = r.whiteFlash.toFixed(3); } else flash.style.opacity = 0;
  gl.style.visibility = handed ? 'hidden' : 'visible';
  endbgFx.style.opacity = handed ? 1 : 0;
  overlay.seek(t);
  return true;

window.seek(+(q.get('t') || 0));
