<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blitzedo — Play beyond</title>
  <meta name="description" content="Blitzedo is a small game studio building worlds worth getting lost in.">
  <meta name="theme-color" content="#090A08">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="wordmark" href="./" aria-label="blitzedo, home">blitzedo</a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="menu-toggle__label">Menu</span>
      <span class="menu-toggle__bars" aria-hidden="true"><i></i><i></i></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <a href="games.html">Games</a>
      <a href="studio.html">Studio</a>
      <a href="contact.html" class="site-nav__contact">
        Contact
        <svg class="icon icon--up-right" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M3.5 12.5 12 4M5.2 3.8h7v7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </a>
    </nav>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero__copy">
        <h1 class="hero__title">Play<br>beyond</h1>
        <a class="btn" href="games.html">
          <span>Explore games</span>
          <svg class="icon icon--arrow" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true" focusable="false">
            <path d="M1 10h24M17 2l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </a>
      </div>

      <figure class="hero__art">
        <img class="hero__sculpture"
          src="assets/sculpture.webp"
          srcset="assets/sculpture-1000.webp 1000w, assets/sculpture.webp 2199w"
          sizes="(max-width: 900px) 100vw, 46vw"
          width="2199" height="2699"
          alt="A lowercase b built from small charcoal blocks, floating on a rocky island. A stairway climbs to a tiny ivory explorer in a red scarf, and a red doorway glows in the bowl."
          fetchpriority="high" decoding="async">
      </figure>
    </section>
  </main>

  <script src="js/menu.js" defer></script>
</body>
</html>
